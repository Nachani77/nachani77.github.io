name: Stable gallery tail patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-tail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery append behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".archive{padding:3vw;columns:4 260px;column-gap:10px}\n.archive.is-loading{min-height:40vh}\n"
          new_css = ".archive{padding:3vw;columns:4 260px;column-gap:10px}\n.archive.is-loading{min-height:40vh}\n.archive-tail{padding:0 3vw 3vw}\n.archive-tail-batch{columns:4 260px;column-gap:10px}\n.archive-tail-batch+.archive-tail-batch{margin-top:10px}\n.archive-tail-batch .photo{margin-bottom:10px}\n"
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = "@media(max-width:650px){header{padding:22px 16px 18px}.archive{padding:16px;columns:2 140px;column-gap:6px}.photo{margin-bottom:6px}"
          new_mobile = "@media(max-width:650px){header{padding:22px 16px 18px}.archive{padding:16px;columns:2 140px;column-gap:6px}.archive-tail{padding:0 16px 16px}.archive-tail-batch{columns:2 140px;column-gap:6px}.archive-tail-batch+.archive-tail-batch{margin-top:6px}.archive-tail-batch .photo{margin-bottom:6px}.photo{margin-bottom:6px}"
          if old_mobile not in s:
              raise SystemExit('Mobile CSS anchor not found')
          s = s.replace(old_mobile, new_mobile, 1)

          old_render = "function renderPhoto(photo,index){const item=document.createElement('div');item.className='photo';const img=document.createElement('img');img.width=photo.w;img.height=photo.h;img.alt='';img.decoding='async';if(index<6){img.loading='eager';img.fetchPriority=index<2?'high':'auto'}else img.loading='lazy';retryImage(img,photos[index],()=>img.classList.add('loaded'));item.appendChild(img);item.addEventListener('click',()=>openLightbox(index));archive.appendChild(item)}"
          new_render = "function renderPhoto(photo,index,parent=archive){const item=document.createElement('div');item.className='photo';const img=document.createElement('img');img.width=photo.w;img.height=photo.h;img.alt='';img.decoding='async';if(index<6){img.loading='eager';img.fetchPriority=index<2?'high':'auto'}else img.loading='lazy';retryImage(img,photos[index],()=>img.classList.add('loaded'));item.appendChild(img);item.addEventListener('click',()=>openLightbox(index));parent.appendChild(item)}\nlet tailArchive=null;\nfunction ensureTailArchive(){if(tailArchive)return tailArchive;tailArchive=document.createElement('div');tailArchive.className='archive-tail';tailArchive.id='archiveTail';archive.insertAdjacentElement('afterend',tailArchive);return tailArchive}"
          if old_render not in s:
              raise SystemExit('renderPhoto anchor not found')
          s = s.replace(old_render, new_render, 1)

          old_hydrate = "async function hydrateUnknownTail(start){const batchSize=6;for(let i=start;i<photoData.length;i+=batchSize){const batch=[];for(let j=i;j<Math.min(i+batchSize,photoData.length);j++)batch.push({photo:photoData[j],index:j});await Promise.all(batch.map(({photo})=>probeDimensions(photo)));batch.forEach(({photo,index})=>renderPhoto(photo,index));await new Promise(resolve=>requestAnimationFrame(resolve))}}"
          new_hydrate = "async function hydrateUnknownTail(start){const batchSize=8,tail=ensureTailArchive();for(let i=start;i<photoData.length;i+=batchSize){const batch=[];for(let j=i;j<Math.min(i+batchSize,photoData.length);j++)batch.push({photo:photoData[j],index:j});await Promise.all(batch.map(({photo})=>probeDimensions(photo)));const group=document.createElement('div');group.className='archive-tail-batch';batch.forEach(({photo,index})=>renderPhoto(photo,index,group));tail.appendChild(group);await new Promise(resolve=>requestAnimationFrame(resolve))}}"
          if old_hydrate not in s:
              raise SystemExit('hydrateUnknownTail anchor not found')
          s = s.replace(old_hydrate, new_hydrate, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "Nachani77"
          git config user.email "krea4321@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep newly loaded photos at gallery bottom"
          git push
