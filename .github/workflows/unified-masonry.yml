name: Unified masonry patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified-masonry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery
        run: python .github/scripts/patch_unified_masonry.py
      - name: Commit patch
        run: |
          git config user.name "Nachani77"
          git config user.email "krea4321@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use one continuous stable masonry gallery"
          git push
