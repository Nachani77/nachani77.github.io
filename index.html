function showLightboxUI(){if(!lightbox.classList.contains('open'))return;lightbox.classList.remove('ui-hidden');clearTimeout(uiTimer);uiTimer=setTimeout(()=>{if(lightbox.classList.contains('open')&&!lightboxAnimating)lightbox.classList.add('ui-hidden')},2200)}
function updateLightboxCount(){lightboxCount.textContent=`${String(currentIndex+1).padStart(3,'0')} / ${String(photos.length).padStart(3,'0')}`}
function preloadWithRetry(src,token,onLoad,onFail){const pre=new Image();pre.decoding='async';let attempt=0;const tryLoad=()=>{pre.src=attempt?`${src}&retry=${attempt}-${Date.now()}`:src};pre.onload=()=>{if(token===lightboxRequest&&lightbox.classList.contains('open'))onLoad(pre.src)};pre.onerror=()=>{if(token!==lightboxRequest)return;if(attempt<2){attempt++;setTimeout(tryLoad,500*attempt)}else onFail?.()};tryLoad()}
function renderLightbox(){const token=++lightboxRequest;lightboxImage.className='';updateLightboxCount();preloadWithRetry(photos[currentIndex],token,src=>{lightboxImage.src=src;if(reducedMotion)lightboxImage.className='ready';else requestAnimationFrame(()=>requestAnimationFrame(()=>lightboxImage.classList.add('ready')))},()=>showLightboxUI());preloadNeighbors()}
function openLightbox(index){currentIndex=index;lightbox.classList.add('open');document.body.style.overflow='hidden';renderLightbox();showLightboxUI()}
function closeLightbox(){clearTimeout(uiTimer);clearTimeout(transitionTimer);clearTimeout(unlockTimer);lightboxRequest++;lightboxAnimating=false;lightbox.classList.remove('open','ui-hidden');lightboxImage.className='';document.body.style.overflow=''}
function finishMove(targetIndex,forward,loadedSrc,token){if(token!==lightboxRequest||!lightbox.classList.contains('open'))return;currentIndex=targetIndex;updateLightboxCount();lightboxImage.className=forward?'slide-in-right':'slide-in-left';lightboxImage.src=loadedSrc;const enter=()=>{if(token!==lightboxRequest)return;lightboxImage.className='ready';const done=()=>{if(token!==lightboxRequest)return;lightboxAnimating=false;preloadNeighbors();showLightboxUI()};if(reducedMotion)done();else unlockTimer=setTimeout(done,250)};if(reducedMotion)enter();else requestAnimationFrame(()=>requestAnimationFrame(enter))}
function moveLightbox(step){if(lightboxAnimating||!lightbox.classList.contains('open'))return;lightboxAnimating=true;showLightboxUI();const forward=step>0,targetIndex=(currentIndex+step+photos.length)%photos.length,token=++lightboxRequest;preloadWithRetry(photos[targetIndex],token,loadedSrc=>{if(token!==lightboxRequest)return;const swap=()=>finishMove(targetIndex,forward,loadedSrc,token);if(reducedMotion){swap();return}lightboxImage.className=forward?'ready slide-out-left':'ready slide-out-right';transitionTimer=setTimeout(swap,180)},()=>{if(token!==lightboxRequest)return;lightboxAnimating=false;showLightboxUI()})}
document.getElementById('lightboxClose').addEventListener('click',closeLightbox);document.getElementById('lightboxPrev').addEventListener('click',()=>moveLightbox(-1));document.getElementById('lightboxNext').addEventListener('click',()=>moveLightbox(1));
lightbox.addEventListener('mousemove',showLightboxUI,{passive:true});lightbox.addEventListener('pointerdown',showLightboxUI,{passive:true});lightbox.addEventListener('click',e=>{showLightboxUI();if(e.target===lightbox)closeLightbox()});
document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;showLightboxUI();if(e.key==='Escape'){closeLightbox();return}if(e.key==='ArrowLeft')moveLightbox(-1);if(e.key==='ArrowRight')moveLightbox(1)});
lightbox.addEventListener('touchstart',e=>{showLightboxUI();const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});lightbox.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)moveLightbox(dx<0?1:-1)},{passive:true});
</script></body></html>
