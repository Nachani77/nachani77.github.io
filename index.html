<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NACHAN — PHOTO ARCHIVE</title>
<meta name="description" content="NACHAN — Character & Portrait Photography — X: @nachani77">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}header{display:flex;justify-content:space-between;align-items:flex-end;padding:32px 3vw 24px;border-bottom:1px solid #e8e8e8}h1{font-size:clamp(22px,3vw,42px);line-height:.9;letter-spacing:-.04em;margin:0}h1 span{display:block;font-size:.42em;letter-spacing:.18em;margin-top:10px;font-weight:500}.meta{text-align:right;font-size:12px;line-height:1.6;color:#555}.archive{padding:3vw;columns:4 260px;column-gap:10px}.photo{display:block;width:100%;margin:0 0 10px;break-inside:avoid;cursor:zoom-in;background:#f3f3f3}.photo img{display:block;width:100%;height:auto}.empty{column-span:all;min-height:45vh;display:grid;place-items:center;color:#aaa;font-size:12px;letter-spacing:.15em}.about{margin:8vw 3vw 3vw;padding-top:28px;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 2fr;gap:30px;font-size:14px;line-height:1.8}.about h2{margin:0;font-size:13px;letter-spacing:.15em}.about p{margin:0;max-width:650px}.contact{margin-top:22px}.contact a{color:inherit;text-decoration:none;border-bottom:1px solid #999}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:20;padding:24px;cursor:zoom-out}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh;object-fit:contain}@media(max-width:650px){header{padding:22px 16px 18px}.archive{padding:16px;columns:2 140px;column-gap:6px}.photo{margin-bottom:6px}.about{margin:60px 16px 24px;grid-template-columns:1fr;gap:14px}.meta{font-size:10px}}
</style>
</head>
<body>
<header><h1>NACHAN<span>PHOTO ARCHIVE</span></h1><div class="meta">CHARACTER &amp; PORTRAIT PHOTOGRAPHY<br>X: @nachani77</div></header>
<main id="archive" class="archive"><div class="empty">ARCHIVE INITIALIZING</div></main>
<section class="about"><h2>ABOUT</h2><div><p><strong>NACHAN</strong><br>Character &amp; Portrait Photography<br>X: @nachani77</p><p class="contact">Instagram · Email</p></div></section>
<div id="lightbox" class="lightbox"><img id="lightboxImage" alt=""></div>
<script>
const photos=[
'https://drive.google.com/thumbnail?id=1ElOTxJ2TsxGpmkQ_VWVh1AHbZCYu-BQ0&sz=w1800',
'https://drive.google.com/thumbnail?id=1U8OYc7A_4P9UaOgm4n_ST_dZlqCh8gM2&sz=w1800',
'https://drive.google.com/thumbnail?id=1p0xF_4V5zI04mWh1q2E5vkxVa1pnuQGV&sz=w1800',
'https://drive.google.com/thumbnail?id=1TCTDFjsyZT7yCitt8mXalN428aE6e-a4&sz=w1800'
];
const archive=document.getElementById('archive');
if(photos.length){archive.innerHTML='';photos.forEach(src=>{const a=document.createElement('div');a.className='photo';const img=document.createElement('img');img.src=src;img.loading='lazy';img.alt='';a.appendChild(img);a.onclick=()=>{document.getElementById('lightboxImage').src=src;document.getElementById('lightbox').classList.add('open')};archive.appendChild(a)})}
document.getElementById('lightbox').onclick=e=>e.currentTarget.classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open')});
</script>
</body></html>
